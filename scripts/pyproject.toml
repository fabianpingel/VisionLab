[project]
name = "visionlab-export"
version = "0.1.0"
description = "Skripte zum Export von YOLO-Modellen nach ONNX für VisionLab."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "Fabian Pingel", email = "fabian.pingel.work@gmail.com" },
]

# Laufzeit-Abhängigkeiten für den Export-Workflow.
dependencies = [
    "ultralytics>=8.3.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
]

[dependency-groups]
# Entwicklungs-Abhängigkeiten (Tests, Linting).
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
