<!doctype html>
<!--
  ============================================================================
  index.html — Einstiegspunkt der App
  ============================================================================

  Anders als bei Streamlit, wo Python das HTML generiert, ist eine React-App
  eine echte Single-Page-Application (SPA): Es gibt EINE HTML-Datei, in die
  React zur Laufzeit den UI-Baum montiert.

  Wichtige Punkte:
    - <html lang="de">      → wir signalisieren deutsche UI für Screenreader
    - <meta viewport>       → korrekte Skalierung auf mobilen Geräten
    - <meta theme-color>    → Browser-UI-Farbe (Adressleiste auf Mobile)
    - <div id="root">       → React mountet hier seinen UI-Baum (siehe main.tsx)
    - <script type=module>  → moderner ES-Module-Import statt klassisches <script>
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons (von scripts/generate_icons.py erzeugt) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <!-- iOS Homescreen-Icon -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VisionLab" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color setzt die Browser-UI-Farbe (Adressleiste auf Mobile).
         Wert = --color-background aus tokens.css (PINGEL-Brand-Hintergrund). -->
    <meta name="theme-color" content="#0b1024" />
    <meta name="description" content="VisionLab — Live-Objekterkennung im Browser. Eine Demo von PINGEL AI Solutions." />

    <!-- PWA-Manifest wird vom vite-plugin-pwa automatisch injiziert. -->

    <title>VisionLab — PINGEL AI Solutions</title>
  </head>
  <body>
    <!-- React montiert den UI-Baum in dieses div (siehe src/main.tsx). -->
    <div id="root"></div>

    <!-- Vite ersetzt diesen Pfad beim Build durch die gebündelte JS-Datei. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
